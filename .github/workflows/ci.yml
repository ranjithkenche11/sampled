name: Drupal CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: drupal
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysql, gd, opcache

      - name: Install Composer dependencies
        run: composer install --no-progress --no-suggest

      - name: Set up Drupal
        run: |
          cp web/sites/default/default.settings.php web/sites/default/settings.php
          echo "\$databases['default']['default'] = [
            'database' => 'drupal',
            'username' => 'root',
            'password' => 'root',
            'host' => '127.0.0.1',
            'port' => '3306',
            'driver' => 'mysql',
            'prefix' => '',
          ];" >> web/sites/default/settings.php
          vendor/bin/drush site:install minimal --db-url=mysql://root:root@127.0.0.1:3306/drupal --yes

      - name: Run code quality checks
        run: |
          composer require --dev drupal/coder
          vendor/bin/phpcs --standard=Drupal --extensions=php,module,inc,install,test,profile,theme web/modules/custom web/themes/custom

      - name: Run unit tests
        run: |
          vendor/bin/phpunit --configuration web/core/phpunit.xml.dist web/modules/custom